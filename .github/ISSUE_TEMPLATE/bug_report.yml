name: Bug report
description: Report a reproducible problem in the akiyan additions (control protocol v2, recording, MCP server)
title: "bug: "
labels: [bug]
body:
  - type: textarea
    id: summary
    attributes:
      label: Summary
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: Reproduction
      description: Do not attach commercial ROMs or sensitive memory dumps.
    validations:
      required: true
  - type: textarea
    id: environment
    attributes:
      label: Environment
      description: OS, Go version, akiyan/blastem commit, build options, and MCP host.
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Sanitized logs

